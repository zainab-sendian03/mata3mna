org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Improve network connection and retry
org.gradle.daemon=true
# Disable parallel to avoid overwhelming network connection
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true
# Timeout settings (increased for slow connections)
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
# Retry settings
systemProp.http.maxRedirects=10
# Enable Gradle retry mechanism
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000
# Additional network settings
org.gradle.daemon.idletimeout=10800000
# Disable automatic SDK installation to avoid SDK 36 requirement
android.builder.sdkDownload=false
